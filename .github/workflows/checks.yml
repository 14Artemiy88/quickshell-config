name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Static and fixture-based regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq curl file python3 nodejs gawk
      - name: Run regression suite
        run: bash CHECK.sh
